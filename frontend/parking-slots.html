<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Slots | Smart Wedding Parking</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <main class="dashboard-content">
        <div class="page-header">
            <div>
                <h1>Parking Slots</h1>
                <p class="welcome-msg">Live availability and assigned vehicles</p>
            </div>
            <button id="logout-button" class="logout-btn">Sign Out</button>
        </div>
        <div class="stats-row">
            <div class="stat-card stat-total">
                <span class="stat-icon">🅿</span>
                <div>
                    <p class="stat-label">Total Slots</p>
                    <p class="stat-value" id="total-slots">—</p>
                </div>
            </div>
            <div class="stat-card stat-available">
                <span class="stat-icon">✅</span>
                <div>
                    <p class="stat-label">Available</p>
                    <p class="stat-value" id="available-slots">—</p>
                </div>
            </div>
            <div class="stat-card stat-occupied">
                <span class="stat-icon">🚗</span>
                <div>
                    <p class="stat-label">Occupied</p>
                    <p class="stat-value" id="occupied-slots">—</p>
                </div>
            </div>
            <div class="stat-card stat-unavailable">
                <span class="stat-icon">🚫</span>
                <div>
                    <p class="stat-label">Unusable</p>
                    <p class="stat-value" id="unavailable-slots">—</p>
                </div>
            </div>
        </div>
        <section class="section-card">
            <div class="section-card-header">
                <h2>Slot Availability</h2>
                <div class="legend">
                    <span><i class="dot available"></i> Available</span>
                    <span><i class="dot occupied"></i> Occupied</span>
                    <span><i class="dot unavailable"></i> Unusable</span>
                </div>
            </div>
            <div id="parking-grid" class="parking-grid"></div>
            <p id="grid-status" class="loading-msg">Loading parking slots...</p>
        </section>
    </main>
    <script type="module">
        import { apiRequest, requireRole, supabase } from './app.js';

        const access = await requireRole(['admin', 'manager', 'attendant']);
        if (!access) {
            throw new Error('Staff sign-in required.');
        }

        document.getElementById('logout-button').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.replace('/');
        });

        async function refreshParkingSlots() {
            const grid = document.getElementById('parking-grid');
            const gridStatus = document.getElementById('grid-status');

            try {
                const data = await apiRequest('/api/slots');
                const slots = data.slots || [];
                const unavailableSlots = slots.filter(slot => slot.display_status === 'unavailable');

                document.getElementById('total-slots').textContent = data.total ?? slots.length;
                document.getElementById('available-slots').textContent = data.available ?? 0;
                document.getElementById('occupied-slots').textContent = data.occupied ?? 0;
                document.getElementById('unavailable-slots').textContent = unavailableSlots.length;

                grid.replaceChildren();

                if (slots.length === 0) {
                    gridStatus.textContent = 'No parking slots found. Run database/02_insert_parking_slots.sql in Supabase.';
                    return;
                }

                gridStatus.textContent = '';
                slots.forEach(slot => {
                    const state = slot.display_status || 'available';
                    const occupied = state === 'occupied';
                    const tile = document.createElement('div');
                    tile.className = `parking-slot ${state}`;
                    tile.title = occupied
                        ? `P${slot.slot_number} — ${slot.registration_number || 'Unknown'}`
                        : `P${slot.slot_number} — ${state}`;
                    tile.innerHTML = `
                        <div class="slot-number">P${slot.slot_number}</div>
                        <div class="slot-registration">${occupied ? (slot.registration_number || 'Unknown') : 'No vehicle'}</div>
                        <div class="slot-status">${state.charAt(0).toUpperCase() + state.slice(1)}</div>
                    `;
                    grid.appendChild(tile);
                });
            } catch (err) {
                gridStatus.textContent = 'Could not load parking slots: ' + err.message;
            }
        }

        await refreshParkingSlots();
    </script>
    <script src="/sidebar.js"></script>
</body>
</html>
