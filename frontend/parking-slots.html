
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Parking Spots | Smart Wedding Parking</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="dashboard-content">
        <h1>Assign Parking Spots</h1>
        <p>View parking availability and manage vehicle spot assignments.</p>

        <section class="parking-summary">
            <h2>Parking Overview</h2>

            <div class="parking-cards">
                <div class="parking-card">
                    <h3>Total Slots</h3>
                    <p id="total-slots">--</p>
                </div>

                <div class="parking-card">
                    <h3>Available</h3>
                    <p id="available-slots">--</p>
                </div>

                <div class="parking-card">
                    <h3>Occupied</h3>
                    <p id="occupied-slots">--</p>
                </div>
            </div>
        </section>

        <section class="parking-assignment">
            <h2>Slot Availability</h2>
            <p>Parking slot details will appear here.</p>
        </section>
    </main>

    <script src="/sidebar.js"></script>
</body>
</html>
