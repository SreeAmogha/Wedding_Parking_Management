<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Entry / Exit | Smart Wedding Parking</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <div id="sidebar-container"></div>
   <main class="dashboard-content">
       <div class="page-header">
           <div>
               <h1>Vehicle Entry &amp; Exit</h1>
               <p class="welcome-msg">Register vehicle arrivals and departures</p>
           </div>
           <button id="logout-button" class="logout-btn">Sign Out</button>
       </div>
       <div class="two-col-grid">
           <!-- ── VEHICLE ENTRY ── -->
           <section class="section-card">
               <div class="section-card-header">
                   <h2>🚘 Register Vehicle Entry</h2>
               </div>
               <p class="section-desc">Assign a parking slot to an arriving guest vehicle.</p>
               <label for="event-select">Wedding Event</label>
               <select id="event-select" required>
                   <option value="">Loading events…</option>
               </select>
               <form id="vehicle-entry-form">
                   <label for="registration-number">Vehicle Registration Number</label>
                   <input
                       type="text"
                       id="registration-number"
                       placeholder="e.g. KA01AB1234"
                       required
                       pattern="[A-Za-z0-9]{10}"
                       minlength="10"
                       maxlength="10"
                       title="Enter exactly 10 letters or digits"
                   >
                   <label for="vehicle-type">Vehicle Type</label>
                   <select id="vehicle-type" required>
                       <option value="">Select vehicle type</option>
                       <option value="car">Car</option>
                       <option value="suv">SUV</option>
                       <option value="bike">Bike</option>
                       <option value="van">Van</option>
                       <option value="other">Other</option>
                   </select>
                   <label for="guest-name">Guest Name</label>
                   <input
                       type="text"
                       id="guest-name"
                       placeholder="Enter guest name"
                   >
                   <label for="guest-contact">Guest Contact</label>
                   <input
                       type="tel"
                       id="guest-contact"
                       placeholder="10-digit contact number"
                       required
                       pattern="[0-9]{10}"
                       minlength="10"
                       maxlength="10"
                   >
                   <button type="submit" id="register-vehicle-button" class="btn-primary">
                       Register &amp; Assign Slot
                   </button>
                   <p id="entry-status" class="form-status" role="status"></p>
               </form>
           </section>
           <!-- ── VEHICLE EXIT ── -->
           <section class="section-card">
               <div class="section-card-header">
                   <h2>🚪 Register Vehicle Exit</h2>
               </div>
               <p class="section-desc">Free up a parking slot when a guest vehicle leaves.</p>
               <form id="vehicle-exit-form">
                   <label for="exit-registration-number">Vehicle Registration Number</label>
                   <input
                       type="text"
                       id="exit-registration-number"
                       placeholder="e.g. KA03MN5678"
                       required
                       maxlength="20"
                   >
                   <button type="submit" id="register-exit-button" class="btn-danger">
                       Record Vehicle Exit
                   </button>
                   <p id="exit-status" class="form-status" role="status"></p>
               </form>
           </section>
       </div>
   </main>
   <script type="module">
       import { apiRequest, requireRole, supabase } from './app.js';
       const access = await requireRole(['attendant']);
       if (access) {
           document.getElementById('logout-button').addEventListener('click', async () => {
               await supabase.auth.signOut();
               window.location.replace('/');
           });

           async function loadEvents() {
               const eventSelect = document.getElementById('event-select');
               eventSelect.replaceChildren();
               const placeholder = document.createElement('option');
               placeholder.value = '';
               placeholder.textContent = 'Loading active events…';
               eventSelect.appendChild(placeholder);

               try {
                   const { events = [] } = await apiRequest('/api/events');
                   const eventList = events || [];
                   eventSelect.replaceChildren();
                   const defaultOption = document.createElement('option');
                   defaultOption.value = '';
                   defaultOption.textContent = eventList.some(event => event.status === 'active')
                       ? 'Select an active event'
                       : 'No active events today';
                   eventSelect.appendChild(defaultOption);
                   eventList.filter(event => event.status === 'active').forEach(event => {
                       const option = document.createElement('option');
                       option.value = event.event_id;
                       option.textContent = `${event.event_name} (${event.event_date})`;
                       eventSelect.appendChild(option);
                   });
               } catch (error) {
                   eventSelect.replaceChildren();
                   const option = document.createElement('option');
                   option.value = '';
                   option.textContent = 'Could not load events';
                   eventSelect.appendChild(option);
                   document.getElementById('entry-status').textContent =
                       '❌ Could not load events: ' + error.message;
                   document.getElementById('entry-status').style.color = '#dc2626';
               }
           }

           await loadEvents();
           document.getElementById('vehicle-entry-form').addEventListener('submit', async (e) => {
               e.preventDefault();
               const statusEl = document.getElementById('entry-status');
               const submitBtn = document.getElementById('register-vehicle-button');
               const body = {
                   event_id: document.getElementById('event-select').value,
                   registration_number: document.getElementById('registration-number').value.trim().toUpperCase(),
                   vehicle_type: document.getElementById('vehicle-type').value,
                   guest_name: document.getElementById('guest-name').value.trim(),
                   guest_contact: document.getElementById('guest-contact').value.trim()
               };
               submitBtn.disabled = true;
               statusEl.textContent = 'Registering vehicle…';
               statusEl.style.color = '#64748b';
               try {
                   const result = await apiRequest('/api/entry', {
                       method: 'POST',
                       body: JSON.stringify(body)
                   });
                   statusEl.textContent = `✅ Success! Assigned to slot P${result.assigned_slot_number}`;
                   statusEl.style.color = '#16a34a';
                   e.target.reset();
               } catch (error) {
                   statusEl.textContent = '❌ Entry failed: ' + error.message;
                   statusEl.style.color = '#dc2626';
               } finally {
                   submitBtn.disabled = false;
               }
           });

           document.getElementById('vehicle-exit-form').addEventListener('submit', async (e) => {
               e.preventDefault();
               const statusEl = document.getElementById('exit-status');
               const submitBtn = document.getElementById('register-exit-button');
               const registrationNumber = document.getElementById('exit-registration-number').value.trim().toUpperCase();
               submitBtn.disabled = true;
               statusEl.textContent = 'Recording exit…';
               statusEl.style.color = '#64748b';
               try {
                   const result = await apiRequest('/api/exit', {
                       method: 'POST',
                       body: JSON.stringify({ registration_number: registrationNumber })
                   });
                   statusEl.textContent = `✅ Vehicle exited. Slot P${result.freed_slot_number} is now free.`;
                   statusEl.style.color = '#16a34a';
                   e.target.reset();
               } catch (error) {
                   statusEl.textContent = '❌ Exit failed: ' + error.message;
                   statusEl.style.color = '#dc2626';
               } finally {
                   submitBtn.disabled = false;
               }
           });
       }
   </script>
   <script src="sidebar.js"></script>
</body>
</html>
