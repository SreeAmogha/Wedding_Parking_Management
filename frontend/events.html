<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Manage Events | Smart Wedding Parking</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <div id="sidebar-container"></div>
   <main class="dashboard-content">
       <div class="page-header">
           <div>
               <h1>Manage Events</h1>
               <p class="welcome-msg">Create and manage wedding parking events</p>
           </div>
           <button id="logout-button" class="logout-btn">Sign Out</button>
       </div>
       <div class="two-col-grid">
           <!-- Add Event Form -->
           <section class="section-card">
               <div class="section-card-header">
                   <h2>📅 Add New Event</h2>
               </div>
               <p class="section-desc">Event status is set automatically from its date.</p>
               <form id="add-event-form">
                   <label for="event-name">Event Name</label>
                   <input
                       type="text"
                       id="event-name"
                       name="event_name"
                       placeholder="e.g. Sharma Wedding Reception"
                       required
                   >
                   <label for="event-date">Event Date</label>
                   <input
                       type="date"
                       id="event-date"
                       name="event_date"
                       required
                   >
                   <button type="submit" id="add-event-btn" class="btn-primary">Add Event</button>
                   <p id="event-add-status" class="form-status" role="status"></p>
               </form>
           </section>
           <!-- Events List -->
           <section class="section-card">
               <div class="section-card-header">
                   <h2>📋 Existing Events</h2>
               </div>
               <p id="events-list-status" class="form-status">Loading events…</p>
               <div id="events-list" class="events-list"></div>
           </section>
       </div>
   </main>
   <script type="module">
       import { apiRequest, requireRole, supabase } from './app.js';
       const access = await requireRole(['admin']);
       if (access) {
       // Logout
       document.getElementById('logout-button').addEventListener('click', async () => {
           await supabase.auth.signOut();
           window.location.replace('/');
       });
       const statusBadgeClass = {
           active: 'badge-parked',
           planned: 'badge-planned',
           completed: 'badge-exited'
       };
       // Load existing events
       async function loadEvents() {
           const container = document.getElementById('events-list');
           const statusEl = document.getElementById('events-list-status');
           try {
               const { events } = await apiRequest('/api/events');
               statusEl.textContent = '';
               container.replaceChildren();
               if (!events || events.length === 0) {
                   statusEl.textContent = 'No events yet. Add your first event.';
                   return;
               }
               events.forEach(event => {
                   const card = document.createElement('div');
                   card.className = 'event-item';
                   const info = document.createElement('div');
                   info.className = 'event-item-info';
                   const name = document.createElement('strong');
                   name.textContent = event.event_name;
                   const date = document.createElement('small');
                   date.textContent = `📅 ${new Date(`${event.event_date}T00:00:00`).toLocaleDateString('en-IN', { dateStyle: 'long' })}`;
                   const badge = document.createElement('span');
                   badge.className = `badge ${statusBadgeClass[event.status] || 'badge-exited'}`;
                   badge.textContent = event.status.charAt(0).toUpperCase() + event.status.slice(1);
                   info.append(name, date);
                   card.append(info, badge);
                   container.appendChild(card);
               });
           } catch (error) {
               statusEl.textContent = '❌ Could not load events: ' + error.message;
               statusEl.style.color = '#dc2626';
           }
       }
       await loadEvents();
       // Add event form
       document.getElementById('add-event-form').addEventListener('submit', async (e) => {
           e.preventDefault();
           const addStatus = document.getElementById('event-add-status');
           const btn = document.getElementById('add-event-btn');
           const eventName = document.getElementById('event-name').value.trim();
           const eventDate = document.getElementById('event-date').value;
           btn.disabled = true;
           addStatus.textContent = 'Adding event…';
           addStatus.style.color = '#64748b';
           try {
               await apiRequest('/api/events', {
                   method: 'POST',
                   body: JSON.stringify({ event_name: eventName, event_date: eventDate })
               });
               addStatus.textContent = '✅ Event added successfully!';
               addStatus.style.color = '#16a34a';
               e.target.reset();
               await loadEvents();
           } catch (error) {
               addStatus.textContent = '❌ Could not add event: ' + error.message;
               addStatus.style.color = '#dc2626';
           } finally {
               btn.disabled = false;
           }
       });
       }
   </script>
   <script src="sidebar.js"></script>
</body>
</html>
